<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Planner</title>
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>
<header>
  <h1 id="logo">Seating Planner</h1>
  <select id="classSelect" title="Class"></select>
  <button id="btnNewClass">New class</button>
  <button id="btnRenameClass">Rename</button>
  <button id="btnDupClass">Duplicate</button>
  <button id="btnDelClass">Delete</button>
  <span class="spacer"></span>
  <span id="backupNote"></span>
  <button id="btnBackup" title="Download all classes as a backup file">Backup</button>
  <button id="btnRestore" title="Load a backup file">Restore</button>
  <!-- Links to the other teacher tools. Keep in step with https://gdrutz-blip.github.io/random/tools.json -->
  <details class="more-menu" id="moreMenu">
    <summary title="Other teacher tools">More tools ▾</summary>
    <div class="more-menu-body">
      <div class="more-menu-head">More teacher tools</div>
      <a href="https://gdrutz-blip.github.io/random/" target="_blank" rel="noopener">Randomizer</a>
      <a href="https://gdrutz-blip.github.io/math-strings/" target="_blank" rel="noopener">Math Strings</a>
    </div>
  </details>
  <input type="file" id="fileRestore" accept="application/json,.json" hidden>
</header>
<nav>
  <button data-tab="students">Students</button>
  <button data-tab="layout">Desks</button>
  <button data-tab="prefs">Preferences</button>
  <button data-tab="seating">Seats</button>
  <button data-tab="random">Random seating</button>
  <button data-tab="history">History</button>
  <button data-tab="print">Print / PDF</button>
  <span class="spacer"></span>
  <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
  <label class="viewtoggle"><input type="checkbox" id="chkFlip"> Students' view</label>
  <button id="btnPresent" class="primary">Present</button>
</nav>
<main>
  <aside id="sidebar"></aside>
  <section id="stage"></section>
</main>

<div id="present" hidden>
  <div id="presentTitle"></div>
  <div id="presentStage"></div>
  <div id="presentMsg"></div>
  <button id="pShuffle" class="primary">Shuffle</button>
  <div id="presentControls">
    <select id="pStyle" title="Shuffle style">
      <option value="random">Surprise me</option>
      <option value="slots">One by one</option>
      <option value="tables">Table by table</option>
      <option value="together">All at once</option>
      <option value="spotlight">Name call</option>
      <option value="deal">Deal the cards</option>
    </select>
    <select id="pSpeed" title="Shuffle speed">
      <option value="fast">Fast</option>
      <option value="normal">Normal</option>
      <option value="slow">Dramatic</option>
    </select>
    <button id="pFlip">Flip view</button>
    <button id="pExit">Exit</button>
  </div>
</div>

<script src="js/solver.js?v=17"></script>
<script src="js/builder.js?v=17"></script>
<script src="js/app.js?v=17"></script>
<script>
  // close the "More tools" menu when you click elsewhere or press Esc
  (function () {
    var m = document.getElementById('moreMenu');
    document.addEventListener('click', function (e) { if (m.open && !m.contains(e.target)) m.open = false; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') m.open = false; });
  })();
</script>
</body>
</html>
